<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fridge Light: Retro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1f2b38;
  --ink-2: #4a5968;
  --ink-3: #6d7b88;
  --red: #c9412f;
  --enamel: #bfd6e2;
  --chrome: linear-gradient(180deg, #fbfcfc 0%, #dde2e5 44%, #aeb7bd 56%, #eef1f2 100%);
}
* { box-sizing: border-box; margin: 0; }
html { background: #1d2a33; -webkit-font-smoothing: antialiased; }
body { font-family: 'Jost', system-ui, sans-serif; color: var(--ink); font-variant-numeric: tabular-nums; }
::selection { background: var(--ink); color: #fff; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
button:disabled { cursor: default; }

.stage { min-height: 100vh; padding: 34px 40px 44px; display: flex; flex-direction: column; align-items: center; gap: 26px; background: radial-gradient(120% 70% at 50% 0%, #2c3c48 0%, #1d2a33 72%); }
.intro { width: 834px; max-width: 100%; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; color: #eef3f6; }
.intro h1 { font-size: 30px; font-weight: 600; letter-spacing: -.01em; }
.intro p { margin-top: 6px; max-width: 60ch; font-size: 15px; line-height: 1.5; color: rgba(238, 243, 246, .66); }
.replay { flex: none; height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,.22); background: transparent; color: #eef3f6; font-weight: 500; font-size: 15px; }
.phones { display: flex; flex-wrap: wrap; justify-content: center; gap: 48px; }
figure { display: flex; flex-direction: column; align-items: center; gap: 14px; }
figcaption { font-size: 15px; font-weight: 500; color: rgba(238, 243, 246, .55); }

/* the phone is the fridge's rounded enamel body, catching the light down its middle */
.phone { position: relative; width: 393px; height: 852px; overflow: hidden; border-radius: 52px; background: linear-gradient(90deg, #aec9d7 0%, #c8dce6 28%, #d9e8ef 50%, #c6dae5 72%, #a9c5d4 100%); box-shadow: 0 40px 80px -24px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.2); }
.status { height: 54px; padding: 8px 30px 0 38px; display: flex; align-items: center; justify-content: space-between; font-size: 16px; font-weight: 600; }
.bar { height: 58px; padding: 0 14px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.bar > :first-child { justify-self: start; }
.bar > :last-child { justify-self: end; }
.bar h1 { font-size: 20px; font-weight: 600; }
.knob { width: 42px; height: 42px; border: 0; border-radius: 50%; display: grid; place-items: center; background: var(--chrome); box-shadow: 0 2px 4px rgba(31,43,56,.25), inset 0 0 0 1px rgba(255,255,255,.7); }
.pill { height: 40px; padding: 0 16px; border: 0; border-radius: 20px; font-size: 15px; font-weight: 500; background: var(--chrome); box-shadow: 0 2px 4px rgba(31,43,56,.25), inset 0 0 0 1px rgba(255,255,255,.7); }
.zones { display: flex; gap: 2px; padding: 3px; border-radius: 22px; background: rgba(31,43,56,.1); box-shadow: inset 0 1px 2px rgba(31,43,56,.18); }
.zone { height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: none; font-size: 15px; font-weight: 500; color: var(--ink-2); }
.zone.on { background: #fdfdfc; color: var(--ink); box-shadow: 0 1px 3px rgba(31,43,56,.25); }

/* cabinet: enamel box, a badge plate, the opening */
.cabinet { position: absolute; border-radius: 30px; background: linear-gradient(90deg, #c3d8e3, #d6e6ee 50%, #c0d6e2); box-shadow: inset 0 0 0 1px rgba(255,255,255,.55), 0 14px 26px -16px rgba(31,43,56,.5); }
.band { position: absolute; left: 0; right: 0; top: 0; display: grid; place-items: center; }
.badge { width: 32px; height: 32px; border-radius: 50%; display: block; box-shadow: 0 0 0 3px #e7ebee, 0 0 0 4px #9ea8ae, 0 2px 4px 3px rgba(31,43,56,.2); }
.frame { position: absolute; border-radius: 24px; perspective: 1400px; box-shadow: 0 0 0 4px #e6ebee, 0 0 0 5px #b3bcc2; }
.fridge { position: relative; overflow: hidden; border-radius: 22px; transition: filter .8s ease .25s; }
.closed .fridge { filter: brightness(.12); }
.mid .fridge { filter: brightness(.8); }
.walls { position: absolute; inset: 0; transition: filter .5s ease; }
.w-back { fill: #f4f4f1; } .w-ceil { fill: #fbfbf8; } .w-left, .w-right { fill: #eaebe7; } .w-floor { fill: #e3e5e1; }
.w-seam { stroke: rgba(31,43,56,.07); stroke-width: 1; fill: none; }
.rod { stroke: #b9c2c8; stroke-width: 1.5; stroke-linecap: round; }
.trim { fill: #d7dde0; } .trim-hi { stroke: #fff; stroke-width: 1.2; }
.light { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(75% 45% at 24% 0%, rgba(255, 236, 200, .6), rgba(255, 236, 200, 0) 72%); transition: opacity .5s ease; }
.panel { position: absolute; left: 22px; top: 0; width: 74px; height: 17px; border-radius: 0 0 38px 38px; background: linear-gradient(180deg, #fffef8, #f2e9d3); box-shadow: 0 1px 2px rgba(31,43,56,.15); }

.row { position: absolute; display: flex; justify-content: space-between; }
.col { position: relative; display: flex; flex-direction: column; align-items: center; }
.obj { display: flex; align-items: flex-end; justify-content: center; transition: opacity .5s ease, filter .5s ease; }
.obj svg { display: block; overflow: visible; }
.lab { position: absolute; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 0; text-align: center; white-space: nowrap; z-index: 2; }
.nm { font-size: 14.5px; font-weight: 600; }
.meta { display: flex; align-items: center; gap: 5px; font-size: 13.5px; color: var(--ink-2); }
.soon { font-weight: 600; color: var(--ink); }
.tag { height: 20px; padding: 0 8px; border-radius: 10px; background: var(--red); color: #fff; font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; }
.drawer { position: absolute; border-radius: 12px 12px 24px 24px; background: linear-gradient(180deg, rgba(191, 214, 226, .3), rgba(191, 214, 226, .62)); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.85); }
.drawer::before { content: ''; position: absolute; left: 50%; top: 6px; width: 64px; height: 7px; border-radius: 4px; transform: translateX(-50%); background: var(--chrome); box-shadow: 0 1px 2px rgba(31,43,56,.3); }

/* the open door, seen at an angle, with its shelves */
.door-in { position: absolute; transform-origin: right center; transform: perspective(700px) rotateY(34deg); transition: transform 1.2s cubic-bezier(.16, 1, .3, 1) .45s; z-index: 3; }
.closed .door-in { transform: perspective(700px) rotateY(90deg); }
.mid .door-in { transform: perspective(700px) rotateY(72deg); }
.liner { position: absolute; inset: 0; border-radius: 22px 8px 8px 22px; background: linear-gradient(90deg, #f1f2ef, #fbfbfa 60%, #f3f4f1); box-shadow: 0 0 0 5px #c9dde7, 0 0 0 6px rgba(31,43,56,.12), inset 0 0 0 3px #e2e6e8; transition: filter .5s ease; }
.lip { position: absolute; left: 8px; right: 8px; height: 26px; z-index: 1; border-radius: 0 0 9px 9px; background: rgba(255,255,255,.62); box-shadow: inset 0 0 0 1.5px rgba(31,43,56,.1); }
.lip::before { content: ''; position: absolute; left: -2px; right: -2px; top: -2px; height: 5px; border-radius: 3px; background: var(--chrome); }

.door { position: absolute; inset: 0; z-index: 8; border-radius: 22px; transform-origin: left center; transition: transform 1.2s cubic-bezier(.16, 1, .3, 1), opacity .4s ease .7s; background: linear-gradient(90deg, #c3d8e3, #dbe9f0 45%, #bcd3df); box-shadow: inset 0 0 0 1px rgba(255,255,255,.6); }
.door i { position: absolute; right: 16px; top: 42%; width: 11px; height: 110px; border-radius: 6px; background: linear-gradient(90deg, #aeb7bd, #fbfcfc 45%, #b9c1c6); box-shadow: -3px 5px 8px rgba(31,43,56,.3); }
.door img { position: absolute; left: 50%; top: 28px; width: 48px; height: 48px; margin-left: -24px; border-radius: 50%; box-shadow: 0 0 0 3px #e7ebee, 0 0 0 4px #9ea8ae; }
.open .door { transform: rotateY(-100deg); opacity: 0; pointer-events: none; }
.mid .door { transform: rotateY(-58deg); }
.open .obj svg { animation: settle .8s cubic-bezier(.16, 1, .3, 1) both .6s; }
@keyframes settle { from { transform: translateY(-6px); opacity: 0; } }
.instant .door, .instant .door-in, .instant .fridge, .instant .obj svg { transition: none !important; animation: none !important; }
.lvl, .gone-able { transition: transform .9s cubic-bezier(.2, .8, .2, 1), opacity .5s ease; transform-box: fill-box; }
.lvl { transform-origin: 50% 100%; } .lvlx { transform-origin: 0% 50%; }
.gone { opacity: 0; transform: translateY(-14px); }

/* tonight */
.dim .walls { filter: brightness(.42) saturate(.7); }
.dim .liner { filter: brightness(.5); }
.dim .light { opacity: .2; }
.dim .col:not(.lit) .obj { opacity: .26; filter: grayscale(.5); }
.dim .drawer, .dim .lip { filter: brightness(.55); }
.spots { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
.beam { position: absolute; background: linear-gradient(180deg, rgba(255, 236, 200, 0), rgba(255, 236, 200, .38)); clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%); mix-blend-mode: screen; }
.chip { position: absolute; transform: translateX(-50%); height: 26px; padding: 0 11px; border-radius: 13px; background: var(--ink); color: #fff; font-size: 13.5px; font-weight: 500; display: flex; align-items: center; white-space: nowrap; box-shadow: 0 6px 14px -4px rgba(0,0,0,.45); transition: opacity .4s ease; }
.chip.fade { opacity: 0; }
.sheet { position: absolute; left: 10px; right: 10px; bottom: 92px; z-index: 7; padding: 20px 20px 16px; border-radius: 28px; background: #fdfdfc; box-shadow: inset 0 0 0 1.5px #e3e8eb, 0 18px 34px -16px rgba(31,43,56,.5); }
.sheet .body { transition: opacity .28s ease, transform .28s ease; }
.sheet .body.out { opacity: 0; transform: translateX(-18px); }
.sheet h2 { font-size: 25px; line-height: 1.12; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.why { margin-top: 8px; display: flex; gap: 8px; align-items: baseline; font-size: 15.5px; font-weight: 500; }
.why i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--red); transform: translateY(-1px); }
.facts, .plus { margin-top: 3px; font-size: 15.5px; color: var(--ink-2); }
.actions { margin-top: 16px; display: flex; gap: 10px; }
.go { flex: 1; height: 54px; border: 0; border-radius: 27px; background: var(--ink); color: #fff; font-size: 17px; font-weight: 500; }
.go:hover:not(:disabled) { background: #2c3b4b; }
.go:disabled { opacity: .45; }
.alt { width: 118px; height: 54px; border: 0; border-radius: 27px; background: var(--chrome); box-shadow: inset 0 0 0 1px rgba(255,255,255,.7), 0 1px 3px rgba(31,43,56,.25); font-size: 17px; font-weight: 500; }
.toast { position: absolute; left: 50%; top: 122px; z-index: 9; height: 46px; padding: 0 6px 0 18px; border-radius: 23px; background: var(--ink); color: #fff; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500; white-space: nowrap; box-shadow: 0 12px 26px -10px rgba(0,0,0,.55); opacity: 0; transform: translate(-50%, -10px); transition: opacity .35s ease, transform .45s cubic-bezier(.2, .9, .2, 1); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast button { height: 40px; padding: 0 12px; border: 0; background: none; font-weight: 600; text-decoration: underline; text-underline-offset: 4px; }

.tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding: 8px 12px 0; display: flex; justify-content: space-around; }
.tab { min-width: 72px; height: 48px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 13px; font-weight: 500; color: rgba(31,43,56,.5); }
.tab.on { color: var(--ink); }
.home { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; background: var(--ink); transform: translateX(-50%); }

.spots { transition: opacity .5s ease .9s; }
.closed .spots, .mid .spots { opacity: 0; transition: none; }
@media (prefers-reduced-motion: reduce) { .door, .door-in, .fridge, .obj svg, .lvl, .gone-able, .toast, .sheet .body { transition: none !important; animation: none !important; } }
@media (max-width: 900px) { .stage { padding: 24px 16px; } .intro { flex-direction: column; align-items: flex-start; } }
</style>
</head>
<body>
<!--
THESIS: Fridge Light as a 1950s enamel fridge: the door stays open at your side with milk, butter and eggs in it, the way you actually stand at a fridge.
OWN-WORLD: Pastel blue enamel, chrome knobs, rails and badge plate, a white interior in one-point perspective lit by a warm bulb, chrome wire shelves, a tinted crisper. Food as refined flat illustration with a navy line. Jost.
STORY: The enamel door swings open and settles at your side with its shelves; the bulb warms up; tonight's recipe dims the bulb and warm beams find what it takes, door shelves included.
FIRST VIEWPORT: Pantry with the open door foreshortened on the left, the cabinet with its badge plate on the right; chrome search and add knobs either side of the zone switch.
FORM: Fridge Light variation 2 of 3 (seed 8bf790e3, direction chosen by the user).
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
<main class="stage">
  <div class="intro">
    <div>
      <h1>Fridge Light: Retro</h1>
      <p>A 1950s enamel fridge in pastel blue and chrome. The door stays open at your side with the milk, butter and eggs in its shelves, the way you actually stand at a fridge. A warm bulb, wire shelves, and food drawn as refined flat illustration.</p>
    </div>
    <button class="replay" type="button" id="replay">Open the door again</button>
  </div>
  <div class="phones">
    <figure><div class="phone dim" id="tonight"></div><figcaption>What to cook</figcaption></figure>
    <figure><div class="phone" id="pantry"></div><figcaption>Pantry</figcaption></figure>
  </div>
</main>

<script>
/* Shared demo data and helpers for the Fridge Light variations. */
let flUid = 0;
const uid = (p) => `${p}${++flUid}`;
/* eggs leave the front row first, right to left, the way you would take them */
const EGG_ORDER = [5, 4, 3, 2, 1, 0, 11, 10, 9, 8, 7, 6];
const eggsGone = (n) => new Set(EGG_ORDER.slice(0, 12 - n));

/* The demo account's fridge as seeded, plus one container of leftovers. */
const FOOD = {
  milk:    { name: 'Whole milk', q: '1 gal', days: 2, draw: 'jug', level: .94 },
  yogurt:  { name: 'Greek yogurt', q: '500 g', days: 10, draw: 'tub', level: .8 },
  butter:  { name: 'Butter', q: '227 g', days: 45, draw: 'butter', n: 2 },
  egg:     { name: 'Eggs', q: '12', days: 18, draw: 'eggs', n: 12 },
  cheddar: { name: 'Cheddar', q: '250 g', days: 21, draw: 'cheddar', level: .56 },
  parm:    { name: 'Parmesan', q: '100 g', days: 40, draw: 'wedge', level: .5 },
  chicken: { name: 'Chicken breast', q: '3', days: 3, draw: 'tray', n: 3 },
  bacon:   { name: 'Bacon', q: '8 slices', days: 6, draw: 'bacon', n: 8 },
  chilli:  { name: 'Chilli', q: '2 servings', days: 4, draw: 'box', level: .55 },
  spinach: { name: 'Baby spinach', q: '142 g', days: 1, draw: 'bag', level: 1 },
  mush:    { name: 'Mushrooms', q: '250 g', days: 6, draw: 'punnet', n: 10 },
};

const RECIPES = [
  { name: 'Spinach and Cheddar Scramble', why: 'Uses the spinach, which goes off tomorrow.', urgent: true, facts: '9 min · 390 kcal · serves 1',
    plus: 'Plus olive oil and salt from the cupboard.',
    badge: { egg: '3 eggs', spinach: '2 cups spinach', cheddar: '30 g cheddar' },
    after: { egg: { n: 9, q: '9' }, spinach: { level: .58, q: '82 g' }, cheddar: { level: .5, q: '220 g' } },
    done: 'Cooked. 9 eggs, 82 g spinach and 220 g cheddar left.', kcal: 390 },
  { name: 'Chicken Fried Steak-Style Cutlets', why: 'Uses the milk before Monday.', facts: '40 min · 587 kcal · serves 4',
    plus: 'Plus flour, oil and spices from the cupboard.',
    badge: { chicken: '2 breasts', milk: '1½ cups', egg: '2 eggs' } },
  { name: 'Bacon Carbonara', why: 'Nothing to buy.', facts: '23 min · 1,155 kcal · serves 2',
    plus: 'Plus spaghetti and black pepper.',
    badge: { bacon: '6 slices', egg: '3 eggs', parm: '60 g parmesan' } },
];

/*
 * The food, drawn two ways from the same shapes.
 *
 *   soft: lit objects. Gradient shading, a highlight, a soft contact shadow.
 *   flat: refined illustration. Solid tones, one flat shade plane, a crisp outline.
 *
 * Packaging is drawn cut-away wherever a level is worth seeing, and anything
 * countable is drawn one by one, so how much is left reads without a number.
 */
function makeDraw(style) {
  const soft = style === 'soft';
  const INK = '#1f2b38';
  const E = soft ? 'stroke="#a9b4ba" stroke-width=".8" stroke-linejoin="round"' : `stroke="${INK}" stroke-opacity=".7" stroke-width="1.25" stroke-linejoin="round"`;
  const S = (stops) => stops.map(([o, c, a = 1]) => `<stop offset="${o}" stop-color="${c}" stop-opacity="${a}"/>`).join('');

  function kit() {
    const d = [];
    return {
      /* a gradient when lit, its flat tone when drawn */
      F(flat, stops, dir = 'v') {
        if (!soft) return flat;
        const g = uid('g');
        if (dir === 'r') d.push(`<radialGradient id="${g}" cx=".4" cy=".32" r=".75">${S(stops)}</radialGradient>`);
        else {
          const [x2, y2] = dir === 'h' ? [1, 0] : dir === 'd' ? [1, 1] : [0, 1];
          d.push(`<linearGradient id="${g}" x1="0" y1="0" x2="${x2}" y2="${y2}">${S(stops)}</linearGradient>`);
        }
        return `url(#${g})`;
      },
      clip(shape) {
        const c = uid('c');
        d.push(`<clipPath id="${c}">${shape}</clipPath>`);
        return `url(#${c})`;
      },
      shadow(cx, cy, rx, ry) {
        if (!soft) return `<ellipse cx="${cx}" cy="${cy}" rx="${rx * .92}" ry="${ry * .6}" fill="${INK}" opacity=".1"/>`;
        const g = uid('g');
        d.push(`<radialGradient id="${g}">${S([[0, '#000', .32], [1, '#000', 0]])}</radialGradient>`);
        return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#${g})"/>`;
      },
      /* highlights exist only under light */
      hl: (svg) => (soft ? svg : ''),
      /* flat shade planes exist only in the drawn style */
      fl: (svg) => (soft ? '' : svg),
      done: (w, h, body) => ({ w, h, svg: `<defs>${d.join('')}</defs>${body}` }),
    };
  }

  return {
    jug(it) {
      const k = kit();
      const body = 'M17 10H29V16H41Q53 16 56 26L58 33V84Q58 92 50 92H12Q4 92 4 84V33Q4 23 12 19L17 16Z';
      const hole = 'M37 22H48Q52 22 52 26V31Q52 35 48 35H37Q34 35 34 31V25Q34 22 37 22Z';
      const cp = k.clip(`<path d="${body}"/>`);
      return k.done(62, 98, `${k.shadow(31, 94, 29, 4)}
        <path d="${body} ${hole}" fill-rule="evenodd" fill="${k.F('#e4ebee', [[0, '#d9e1e5'], [.2, '#fff'], [.6, '#edf1f3'], [1, '#c3cdd3']], 'h')}" opacity="${soft ? .85 : 1}"/>
        <g clip-path="${cp}"><g class="lvl" style="transform:scaleY(${it.level})"><rect x="0" y="32" width="62" height="62" fill="${k.F('#ffffff', [[0, '#eef2f4'], [.25, '#fff'], [.65, '#f7f9fa'], [1, '#dbe2e5']], 'h')}"/><rect x="0" y="32" width="62" height="1.5" fill="#cbd5da"/>${k.fl('<rect x="44" y="34" width="14" height="60" fill="#1f2b38" opacity=".06"/>')}</g></g>
        <path d="${body} ${hole}" fill="none" ${E}/>
        ${k.hl('<rect x="8" y="30" width="5" height="54" rx="2.5" fill="#fff" opacity=".8"/>')}
        <rect x="15" y="3" width="16" height="9" rx="2.5" fill="${k.F('#cf3b2c', [[0, '#ea5b4c'], [1, '#a3261d']])}" ${E}/>
        ${k.hl('<rect x="17" y="4.5" width="6" height="2" rx="1" fill="#fff" opacity=".55"/>')}`);
    },
    tub() {
      const k = kit();
      const body = 'M6 13H58L54 50Q53.6 53 50.6 53H13.4Q10.4 53 10 50Z';
      const cp = k.clip(`<path d="${body}"/>`);
      return k.done(64, 58, `${k.shadow(32, 55, 25, 3.5)}
        <path d="${body}" fill="${k.F('#f7f9fa', [[0, '#dce3e6'], [.25, '#fff'], [.7, '#f0f3f5'], [1, '#c6cfd5']], 'h')}"/>
        <g clip-path="${cp}"><rect x="0" y="27" width="64" height="12" fill="${k.F('#3569ae', [[0, '#2b5794'], [.3, '#4679c0'], [1, '#22477c']], 'h')}"/>${k.fl('<rect x="44" y="13" width="20" height="42" fill="#1f2b38" opacity=".07"/>')}</g>
        <path d="${body}" fill="none" ${E}/>
        <rect x="3" y="5" width="58" height="10" rx="4" fill="${k.F('#3d72ba', [[0, '#5b8bd0'], [1, '#2b5791']])}" ${E}/>
        ${k.hl('<rect x="8" y="6.5" width="30" height="2" rx="1" fill="#fff" opacity=".5"/><rect x="13" y="16" width="4" height="32" rx="2" fill="#fff" opacity=".65"/>')}`);
    },
    butter(it) {
      const k = kit();
      const top = k.F('#fbf0c6', [[0, '#fff7d6'], [1, '#f5e5a2']]);
      const front = k.F('#f1db88', [[0, '#f4e094'], [1, '#e0c15c']]);
      const end = k.F('#d9bb5c', [[0, '#dcbf62'], [1, '#c3a246']]);
      let s = k.shadow(38, 46, 34, 3);
      for (let i = 0; i < 2; i++) {
        const y = 30 - i * 14;
        s += `<g class="gone-able ${i >= it.n ? 'gone' : ''}"><path d="M4 ${y}L10 ${y - 5}H72L66 ${y}Z" fill="${top}" ${E}/><rect x="4" y="${y}" width="62" height="12" rx="1" fill="${front}" ${E}/><path d="M66 ${y}L72 ${y - 5}V${y + 7}L66 ${y + 12}Z" fill="${end}" ${E}/><path d="M4 ${y + 5}H66" stroke="#fff" stroke-opacity=".55" stroke-width="1"/>${k.fl(`<path d="M20 ${y}V${y + 12}M46 ${y}V${y + 12}" stroke="#1f2b38" stroke-opacity=".18"/>`)}</g>`;

    },
    eggs(it, tray = 'carton') {
      const k = kit();

      return k.done(124, 56, `${k.shadow(62, 52, 58, 4)}${b}${f}
        <path d="M2 31H122L117 52H7Z" fill="${base}" ${E}/>

        ${k.hl('<path d="M9 40H115" stroke="#fff" stroke-opacity=".4"/>')}`);
    },
    cheddar(it) {
      const k = kit();

        <path d="M3 15L12 6H73L64 15Z" fill="${k.F('#f7c867', [[0, '#fcd57f'], [1, '#f1b94c']])}" ${E}/>

        <path d="M64 15L73 6V33L64 42Z" fill="${k.F('#c9852a', [[0, '#cf8a2a'], [1, '#b57321']])}" ${E}/>

    wedge(it) {

      return k.done(66, 44, `${k.shadow(33, 41, 30, 3)}<g class="lvl lvlx" style="transform:scaleX(${it.level})">
        <path d="M3 40H63V24Q39 8 7 4Q3 4 3 9Z" fill="${k.F('#f1e4bf', [[0, '#f7ecd3'], [1, '#e0cc98']])}" ${E}/>
        <path d="M3 9Q3 4 7 4Q39 8 63 24V30Q39 14 6 10Q3 10 3 13Z" fill="${k.F('#cfa965', [[0, '#dcb772'], [1, '#b58b47']], 'd')}"/>${dots}</g>`);
    },
    tray(it) {

      const meat = k.F('#f1c2b3', [[0, '#fbe3da'], [.6, '#efbcab'], [1, '#d48f7d']], 'r');
      let p = '';
      for (let i = 0; i < 3; i++) {

      }
      return k.done(126, 44, `${k.shadow(63, 41, 58, 3.5)}${p}
        <path d="M2 21H124L118 40H8Z" fill="${k.F('#e9eef0', [[0, '#f6f8f9'], [1, '#c5ced2']])}" ${E}/>
        <path d="M5 21.6H121" stroke="#fff" stroke-width="1.4"/>

    },
    bacon(it) {
      const k = kit();
      let r = '';
      for (let i = 0; i < 8; i++) {
        const y = 20 + i * 4;
        r += `<g class="gone-able ${i >= it.n ? 'gone' : ''}"><path d="M10 ${y}q10 -2.2 20 0t20 0t20 0t18 0" fill="none" stroke="#c8574c" stroke-width="3.2"/>${k.hl(`<path d="M10 ${y - .9}q10 -2.2 20 0t20 0t20 0t18 0" fill="none" stroke="#e57f71" stroke-width=".9" opacity=".8"/>`)}<path d="M10 ${y + 1.7}q10 -2.2 20 0t20 0t20 0t18 0" fill="none" stroke="#fbe4d9" stroke-width="1.1"/></g>`;
      }
      return k.done(98, 62, `${k.shadow(49, 59, 44, 3.5)}
        <rect x="3" y="3" width="92" height="55" rx="5" fill="${k.F('#fbfbfb', [[0, '#fff'], [1, '#dce3e6']])}" ${E}/>
        <rect x="3" y="3" width="92" height="11" rx="5" fill="${k.F('#3f5f82', [[0, '#4b6d91'], [1, '#2f4c6c']])}"/>
        <rect x="8" y="16" width="82" height="38" rx="3" fill="#f8e6dd"/>${r}
        <rect x="8" y="16" width="82" height="38" rx="3" fill="none" ${soft ? 'stroke="#fff" stroke-opacity=".6"' : E}/>
        ${k.hl('<rect x="11" y="18" width="30" height="3" rx="1.5" fill="#fff" opacity=".6"/>')}`);
    },
    box(it) {
      const k = kit();
      const cp = k.clip('<rect x="4" y="14" width="58" height="32" rx="6"/>');
      const beans = [[14, 34], [24, 38], [36, 33], [46, 39], [52, 31], [20, 29], [42, 29]].map(([x, y]) => `<ellipse cx="${x}" cy="${y}" rx="2.6" ry="1.8" fill="#c77b55"/>`).join('');
      return k.done(66, 50, `${k.shadow(33, 47, 30, 3)}
        <g clip-path="${cp}"><g class="lvl" style="transform:scaleY(${it.level})"><rect x="0" y="18" width="66" height="30" fill="${k.F('#8e3d24', [[0, '#a54a2b'], [1, '#6c2915']])}"/>${beans}</g></g>
        <rect x="4" y="14" width="58" height="32" rx="6" fill="${soft ? 'rgba(255,255,255,.35)' : 'none'}" ${E}/>
        <rect x="2" y="7" width="62" height="9" rx="3.5" fill="${k.F('#dce5e9', [[0, '#eef3f5'], [1, '#c1cbd0']])}" ${E}/>
        <g transform="rotate(-4 33 27)"><rect x="15" y="22" width="36" height="10" rx="1" fill="#f1e5b9"/><path d="M19 27.5q3-2.4 6 0t6 0M34 27h11" stroke="#2a2f33" stroke-width="1.1" fill="none" stroke-linecap="round"/></g>
        ${k.hl('<rect x="8" y="17" width="3.5" height="26" rx="1.7" fill="#fff" opacity=".6"/>')}`);
    },
    bag(it) {
      const k = kit();
      const shape = 'M7 11Q45 5 83 11L87 67Q45 75 3 67Z';
      const cp = k.clip(`<path d="${shape}"/>`);
      const leaf = k.F('#5d9a50', [[0, '#80bf69'], [1, '#3a7336']], 'd');
      const leaf2 = k.F('#4a8544', [[0, '#6aa85a'], [1, '#2f6230']], 'd');
      const leaves = [[20, 60, -30, 0], [40, 62, 20, 1], [60, 60, -15, 0], [74, 57, 35, 1], [27, 46, 40, 1], [47, 48, -40, 0], [67, 44, 10, 1], [35, 32, -20, 0], [55, 30, 30, 1], [20, 30, 15, 1], [72, 30, -30, 0]];
      return k.done(90, 78, `${k.shadow(45, 74, 40, 3.5)}
        <g clip-path="${cp}"><g class="lvl" style="transform:scaleY(${it.level})">${leaves.map(([x, y, a, t]) => `<g transform="rotate(${a} ${x} ${y})"><ellipse cx="${x}" cy="${y}" rx="14" ry="8.5" fill="${t ? leaf : leaf2}" ${soft ? '' : 'stroke="#1f2b38" stroke-opacity=".35" stroke-width="1"'}/><path d="M${x - 11} ${y}H${x + 11}" stroke="#b5dca6" stroke-width=".9" opacity=".7"/></g>`).join('')}</g></g>
        <path d="${shape}" fill="#fff" fill-opacity="${soft ? .14 : .08}" ${E}/>
        ${k.hl('<path d="M14 18Q16 44 12 62" stroke="#fff" stroke-opacity=".75" stroke-width="3" fill="none" stroke-linecap="round"/>')}
        <path d="M7 11Q45 5 83 11" fill="none" stroke="${soft ? '#9aa6ab' : INK}" stroke-opacity="${soft ? 1 : .55}" stroke-width="4" stroke-dasharray="1.5 2.5"/>`);
    },
    punnet(it) {
      const k = kit();
      const cap = k.F('#c79f76', [[0, '#e6c7a2'], [.55, '#c29a70'], [1, '#8b6041']], 'r');
      const stem = k.F('#f3ece1', [[0, '#fbf6ee'], [1, '#ddd1bf']], 'h');
      const pos = [[58, 14], [16, 22], [36, 18], [56, 21], [76, 18], [26, 27], [46, 26], [66, 27], [86, 25], [10, 26]];
      let caps = '';
      pos.forEach(([x, y], i) => {
        caps += `<g class="gone-able ${i >= it.n ? 'gone' : ''}"><rect x="${x - 3}" y="${y - 1}" width="6" height="9" rx="2.5" fill="${stem}" ${soft ? '' : E}/><path d="M${x - 11} ${y + 1}Q${x - 11} ${y - 10} ${x} ${y - 10}Q${x + 11} ${y - 10} ${x + 11} ${y + 1}Z" fill="${cap}" ${soft ? '' : E}/><path d="M${x - 9} ${y + 1}H${x + 9}" stroke="#7a573c" stroke-width="1.1" opacity=".7"/></g>`;
      });
      return k.done(98, 54, `${k.shadow(49, 51, 44, 3.5)}${caps}
        <path d="M3 28H95L89 50H9Z" fill="${k.F('#4677b6', [[0, '#5a8bca'], [1, '#2d5890']])}" ${E}/>
        <path d="M4 28.6H94" stroke="#fff" stroke-opacity=".5"/>`);
    },
  };
}

/*
 * The Fridge Light engine, shared by every variation: the perspective
 * interior, the spotlight, cooking, and the door. Variations only restyle it.
 */
const FL = (() => {
  const ICON = {
    Cook: '<path d="M5 10h14v6.5A3.5 3.5 0 0 1 15.5 20h-7A3.5 3.5 0 0 1 5 16.5V10Z"/><path d="M2.5 10H5M19 10h2.5M8 7h8M12 4.5V7"/>',
    Pantry: '<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M6 9.5h12M9 5.5v2M9 12.5v3"/>',
    Shopping: '<path d="M5 8h14l-1.2 11.2A2 2 0 0 1 15.8 21H8.2a2 2 0 0 1-2-1.8L5 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>',
    Eaten: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/>',
    Search: '<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/>',
    Plus: '<path d="M12 5v14M5 12h14"/>',
  };
  const icon = (name, size = 24) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]}</svg>`;

  const status = (c) => `<div class="status"><span>6:04</span><svg width="70" height="12" viewBox="0 0 70 12" fill="${c}" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6" rx="1"/><rect x="10" y="3.5" width="3" height="8.5" rx="1"/><rect x="15" y="1" width="3" height="11" rx="1"/><path d="M31 11.5l2.4-2.6a3.4 3.4 0 0 0-4.8 0zM26.4 6.8a6.5 6.5 0 0 1 9.2 0l-1.6 1.7a4.2 4.2 0 0 0-6 0zM24 4.3a10 10 0 0 1 14 0l-1.6 1.7a7.7 7.7 0 0 0-10.8 0z"/><rect x="44.5" y=".5" width="22" height="11" rx="3.5" fill="none" stroke="${c}" stroke-opacity=".45"/><rect x="46.5" y="2.5" width="16" height="7" rx="2"/><rect x="67.5" y="4" width="1.8" height="4" rx=".9" fill-opacity=".45"/></svg></div>`;
  const tabs = (on) => `<nav class="tabs">${['Cook', 'Pantry', 'Shopping', 'Eaten'].map((t) => `<button type="button" class="tab ${t === on ? 'on' : ''}">${icon(t)}<span>${t}</span></button>`).join('')}</nav><div class="home"></div>`;
  const when = (f) => (f.days === 1 ? '<span class="tag">Tomorrow</span>' : f.days <= 3 ? `<span class="soon">· ${f.days} days left</span>` : '');

  /* One item: the drawing, and its label printed below the shelf edge. */
  function col(key, o) {
    const f = FOOD[key];
    const d = o.D[f.draw](f, o.variant);
    return `<div class="col" data-k="${key}" style="width:${o.w}px">
      <div class="obj" style="height:${o.oh}px"><svg width="${d.w * o.s}" height="${d.h * o.s}" viewBox="0 0 ${d.w} ${d.h}">${d.svg}</svg></div>
      ${o.labels ? `<div class="lab" style="top:${o.labelTop}px"><span class="nm">${f.name}</span><span class="meta"><span data-q>${f.q}</span>${o.split ? '' : when(f)}</span>${o.split && when(f) ? `<span class="meta">${when(f).replace('· ', '')}</span>` : ''}</div>` : ''}
    </div>`;
  }

  /*
   * One-point perspective, eye just below the ceiling, so every shelf shows
   * its top surface and the lower ones show more of it, as they do when you
   * stand at an open fridge.
   */
  function fridge(o) {
    const { W, H, vpY, k, s } = o;
    const bx0 = (W / 2) * (1 - k), bx1 = W - bx0, by0 = vpY * (1 - k), by1 = vpY + (H - vpY) * k;
    const back = (y) => vpY + (y - vpY) * k;
    const shelf = (yf) => {
      const yb = back(yf);
      if (o.shelf === 'wire') {
        let rods = '';
        for (let i = 0; i < 5; i++) {
          const t = i / 5, y = yb + (yf - yb) * t, x = bx0 * (1 - t);
          rods += `<path class="rod" d="M${x} ${y}H${W - x}"/>`;
        }
        return `${rods}<rect class="trim" x="0" y="${yf - 2}" width="${W}" height="5" rx="2.5"/><path class="trim-hi" d="M3 ${yf - 1}H${W - 3}"/>`;
      }
      return `<path class="glass" d="M0 ${yf}H${W}L${bx1} ${yb}H${bx0}Z"/><path class="glass-edge" d="M${bx0} ${yb}H${bx1}"/><rect class="under" x="0" y="${yf + 7}" width="${W}" height="12"/><rect class="trim" x="0" y="${yf}" width="${W}" height="7"/><path class="trim-hi" d="M0 ${yf + 1}H${W}"/>`;
    };
    const oh = Math.round(92 * s);
    const pad = Math.round(bx0 * .55) + 6;
    const rows = o.rows.map((r) => {
      const rest = r.yf - (r.yf - back(r.yf)) * .42;
      const top = rest - oh;
      return `<div class="row" style="top:${top}px;left:${pad}px;right:${pad}px">${r.keys.map((key, j) => col(key, { ...o, w: r.widths[j], oh, labelTop: r.yf + 12 - top })).join('')}</div>`;
    }).join('');
    const dr = o.drawer;
    const drawer = `<div class="drawer" style="top:${dr.y0}px;height:${dr.y1 - dr.y0}px;left:${pad - 6}px;right:${pad - 6}px"><div class="row" style="top:${dr.itemTop}px;left:4px;right:4px;justify-content:space-around">${dr.keys.map((key) => col(key, { ...o, s: s * (dr.scale || 1), w: 150, oh: dr.oh || oh, labelTop: dr.labelTop - dr.itemTop })).join('')}</div></div>`;
    return `<div class="fridge" style="width:${W}px;height:${H}px">
      <svg class="walls" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">
        <path class="w-ceil" d="M0 0H${W}L${bx1} ${by0}H${bx0}Z"/>
        <path class="w-left" d="M0 0L${bx0} ${by0}V${by1}L0 ${H}Z"/>
        <path class="w-right" d="M${W} 0V${H}L${bx1} ${by1}V${by0}Z"/>
        <path class="w-floor" d="M0 ${H}L${bx0} ${by1}H${bx1}L${W} ${H}Z"/>
        <rect class="w-back" x="${bx0}" y="${by0}" width="${bx1 - bx0}" height="${by1 - by0}"/>
        <path class="w-seam" d="M0 0L${bx0} ${by0}M${W} 0L${bx1} ${by0}M0 ${H}L${bx0} ${by1}M${W} ${H}L${bx1} ${by1}"/>
        ${o.rows.map((r) => shelf(r.yf)).join('')}
      </svg>
      <div class="light"></div>
      ${o.top || ''}${rows}${drawer}
    </div>`;
  }

  /* Tonight: the fridge light drops, and a beam finds each thing the recipe takes. */
  function spot(root, r) {
    const layer = root.querySelector('.spots');
    layer.innerHTML = '';
    const pb = root.getBoundingClientRect();
    const sc = pb.width / root.offsetWidth || 1;
    root.querySelectorAll('.col').forEach((c) => {
      const key = c.dataset.k;
      const lit = key in r.badge;
      c.classList.toggle('lit', lit);
      if (!lit) return;
      const sb = c.querySelector('svg').getBoundingClientRect();
      const fb = c.closest('.frame, .door-in').getBoundingClientRect();
      const x = (sb.left - pb.left) / sc, y = (sb.top - pb.top) / sc, w = sb.width / sc, h = sb.height / sc;
      const top = (fb.top - pb.top) / sc + 4;
      layer.insertAdjacentHTML('beforeend', `<div class="beam" style="left:${x - 24}px;width:${w + 48}px;top:${top}px;height:${y + h + 8 - top}px"></div>`);
      layer.insertAdjacentHTML('beforeend', `<span class="chip" style="left:${x + w / 2}px;top:${Math.max(top + 2, y - 30)}px">${r.badge[key]}</span>`);
    });
  }

  let current = 0;
  function show(root, i, instant) {
    current = i;
    delete root.dataset.cooked;
    root.querySelector('.toast')?.classList.remove('on');
    const r = RECIPES[i];
    const body = root.querySelector('.sheet .body');
    const paint = () => {
      body.innerHTML = `<h2>${r.name}</h2><p class="why">${r.urgent ? '<i></i>' : ''}${r.why}</p><p class="facts">${r.facts}</p><p class="plus">${r.plus}</p>`;
      const go = root.querySelector('.go');
      go.textContent = 'Cook this';
      go.disabled = false;
      spot(root, r);
      body.classList.remove('out');
    };
    if (instant) return paint();
    body.classList.add('out');
    setTimeout(paint, 260);
  }

  function cook(root) {
    const r = RECIPES[current];
    const go = root.querySelector('.go');
    if (!r.after) return;
    root.dataset.cooked = 1;
    go.disabled = true;
    root.querySelectorAll('.chip').forEach((c) => { c.textContent = `−${c.textContent}`; });
    setTimeout(() => {
      for (const [key, v] of Object.entries(r.after)) {
        document.querySelectorAll(`.col[data-k="${key}"]`).forEach((col) => {
          if (v.n !== undefined) {
            const out = eggsGone(v.n);
            col.querySelectorAll('[data-egg]').forEach((egg, j) => setTimeout(() => egg.classList.toggle('gone', out.has(+egg.dataset.egg)), j * 40));
          }
          if (v.level !== undefined) col.querySelectorAll('.lvl').forEach((g) => { g.style.transform = g.classList.contains('lvlx') ? `scaleX(${v.level})` : `scaleY(${v.level})`; });
          const q = col.querySelector('[data-q]');
          if (q) q.textContent = v.q;
        });
      }
    }, 350);
    setTimeout(() => {
      root.querySelector('.why').textContent = r.done;
      const t = root.querySelector('.toast');
      t.querySelector('span').textContent = `${r.kcal} kcal logged to today`;
      t.classList.add('on');
    }, 1100);
    // the button that cooked never becomes the button that undoes
    setTimeout(() => { go.textContent = 'Next recipe'; go.disabled = false; }, 1800);
    setTimeout(() => root.querySelectorAll('.chip').forEach((c) => c.classList.add('fade')), 2200);
  }

  function wireTonight(root) {
    show(root, 0, true);
    root.querySelector('.alt').addEventListener('click', () => show(root, (current + 1) % RECIPES.length));
    root.querySelector('.go').addEventListener('click', () => (root.dataset.cooked ? show(root, (current + 1) % RECIPES.length) : cook(root)));
  }

  /* The door opens, and the light comes on because the door opened. */
  function open(phones, mode) {
    phones.forEach((p) => {
      p.classList.remove('open', 'mid', 'instant');
      p.classList.add('closed');
      void p.offsetWidth;
      if (mode === 'still' || mode === 'mid') {
        p.classList.add('instant', mode === 'still' ? 'open' : 'mid');
        p.classList.remove('closed');
        return;
      }
      setTimeout(() => { p.classList.remove('closed'); p.classList.add('open'); }, 450);
    });
  }

  /* the stage: ?still renders the settled screens, ?still=moment the door mid-swing and a cooked recipe */
  function boot(tonightEl, pantryEl) {
    const mode = new URLSearchParams(location.search).get('still');
    if (mode === null) open([tonightEl, pantryEl]);
    else if (mode === 'moment') { open([pantryEl], 'mid'); open([tonightEl], 'still'); setTimeout(() => cook(tonightEl), 50); }
    else open([tonightEl, pantryEl], 'still');
    return mode;
  }

    ${o.shelves.map((b) => `<div class="row" style="top:${b.top}px;left:0;right:0;justify-content:center">${FL.col(b.key, { D, s: b.s, w: o.w, oh: b.oh, labels: o.labels, labelTop: b.lip + 32 - b.top, split: true, variant: 'door' })}</div><div class="lip" style="top:${b.lip}px"></div>`).join('')}
  </div>`;
}

function cabinet(o) {
  return `<div class="cabinet" style="left:${o.left}px;right:8px;top:${o.top}px;height:${o.h}px">
    <div class="band" style="height:${o.band}px"><img class="badge" alt="Pantry2Plate" src="${LOGO}" style="width:${o.badge}px;height:${o.badge}px"></div>
    <div class="frame" style="left:7px;right:7px;top:${o.band + 4}px;height:${o.fh}px">
      ${FL.fridge(o.fridge)}
      <div class="door"><img alt="" src="${LOGO}"><i></i></div>
    </div>
  </div>`;
}

function pantry(el) {
  el.innerHTML = `${FL.status('#1f2b38')}
    <div class="bar"><button type="button" class="knob" aria-label="Search the pantry">${FL.icon('Search', 20)}</button>
      <div class="zones" role="tablist"><button type="button" class="zone on" role="tab">Fridge</button><button type="button" class="zone" role="tab">Cupboard</button><button type="button" class="zone" role="tab">Freezer</button></div>
      <button type="button" class="knob" aria-label="Put food away">${FL.icon('Plus', 20)}</button></div>
    ${doorShelves({ hinge: 100, w: 116, top: 140, h: 596, labels: true, shelves: [
      { key: 'egg', top: 56, oh: 60, s: .72, lip: 100 },
      { key: 'butter', top: 214, oh: 56, s: .86, lip: 256 },
      { key: 'milk', top: 372, oh: 100, s: .98, lip: 452 },
    ] })}
    ${cabinet({ left: 100, top: 116, h: 648, band: 40, badge: 32, fh: 597, fridge: { W: 271, H: 597, vpY: 14, k: .9, s: .72, D, labels: true, shelf: 'wire', top: BULB,
      rows: [
        { yf: 156, keys: ['yogurt', 'chilli'], widths: [122, 122] },
        { yf: 290, keys: ['cheddar', 'parm'], widths: [122, 122] },
        { yf: 424, keys: ['chicken', 'bacon'], widths: [128, 116] },
      ],
      drawer: { y0: 476, y1: 594, keys: ['spinach', 'mush'], itemTop: 2, oh: 62, labelTop: 68, scale: .9 } } })}
    ${FL.tabs('Pantry')}`;
}

function tonight(el) {
  el.innerHTML = `${FL.status('#1f2b38')}
    <div class="bar"><span></span><h1>Tonight</h1><button type="button" class="pill">All recipes</button></div>
    ${doorShelves({ hinge: 88, w: 90, top: 126, h: 372, labels: false, shelves: [
      { key: 'egg', top: 34, oh: 36, s: .5, lip: 60 },
      { key: 'butter', top: 134, oh: 34, s: .6, lip: 158 },
      { key: 'milk', top: 236, oh: 66, s: .64, lip: 290 },
    ] })}
    ${cabinet({ left: 88, top: 112, h: 396, band: 32, badge: 24, fh: 354, fridge: { W: 283, H: 354, vpY: 10, k: .9, s: .56, D, labels: false, shelf: 'wire', top: BULB,
      rows: [
        { yf: 112, keys: ['yogurt', 'chilli'], widths: [128, 128] },
        { yf: 202, keys: ['cheddar', 'parm'], widths: [128, 128] },
        { yf: 292, keys: ['chicken', 'bacon'], widths: [134, 122] },
      ],
      drawer: { y0: 304, y1: 352, keys: ['spinach', 'mush'], itemTop: -6, oh: 46, labelTop: 0, scale: .9 } } })}
    <div class="spots"></div>
    <div class="toast" role="status"><span></span><button type="button">Undo</button></div>
    <section class="sheet"><div class="body"></div><div class="actions"><button type="button" class="go">Cook this</button><button type="button" class="alt">Another</button></div></section>
    ${FL.tabs('Cook')}`;
  FL.wireTonight(el);
}

const T = document.getElementById('tonight'), P = document.getElementById('pantry');
pantry(P);
tonight(T);
FL.boot(T, P);
document.getElementById('replay').addEventListener('click', () => FL.open([T, P]));
</script>
</body>
