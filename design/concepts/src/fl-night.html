<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fridge Light: Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;600;700&family=Red+Hat+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0d0f;
  --ink: #efe9df;
  --ink-2: rgba(239, 233, 223, .64);
  --ink-3: rgba(239, 233, 223, .42);
  --warm: #f3c98b;
  --red: #e2553f;
  --card: #16181b;
}
* { box-sizing: border-box; margin: 0; }
html { background: #070808; -webkit-font-smoothing: antialiased; }
body { font-family: 'Red Hat Text', system-ui, sans-serif; color: var(--ink); font-variant-numeric: tabular-nums; }
::selection { background: var(--warm); color: #111; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--warm); outline-offset: 3px; }
button:disabled { cursor: default; }
h1, h2, .nm, .tab span { font-family: 'Red Hat Display', 'Red Hat Text', sans-serif; }

.stage { min-height: 100vh; padding: 34px 40px 44px; display: flex; flex-direction: column; align-items: center; gap: 26px; background: radial-gradient(120% 70% at 50% 0%, #1b1d20 0%, #070808 72%); }
.intro { width: 834px; max-width: 100%; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; }
.intro h1 { font-size: 30px; font-weight: 700; letter-spacing: -.015em; }
.intro p { margin-top: 6px; max-width: 60ch; font-size: 15px; line-height: 1.5; color: var(--ink-2); }
.replay { flex: none; height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid rgba(239,233,223,.2); background: transparent; font-weight: 600; font-size: 14px; }
.phones { display: flex; flex-wrap: wrap; justify-content: center; gap: 48px; }
figure { display: flex; flex-direction: column; align-items: center; gap: 14px; }
figcaption { font-size: 14px; font-weight: 600; color: var(--ink-3); }

.phone { position: relative; width: 393px; height: 852px; overflow: hidden; border-radius: 52px; background: radial-gradient(120% 50% at 50% -8%, #1b1d20 0%, var(--bg) 62%); box-shadow: 0 40px 80px -24px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.07); }
.status { height: 54px; padding: 8px 30px 0 38px; display: flex; align-items: center; justify-content: space-between; font-size: 16px; font-weight: 600; }
.bar { height: 58px; padding: 0 16px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.bar > :first-child { justify-self: start; }
.bar > :last-child { justify-self: end; }
.logo { width: 44px; height: 44px; border-radius: 50%; display: block; }
.ghost { width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(239,233,223,.16); background: none; display: grid; place-items: center; color: var(--ink); }
.pill { height: 40px; padding: 0 15px; border-radius: 20px; border: 1px solid rgba(239,233,223,.16); background: none; font-size: 14px; font-weight: 600; }
.ghost:hover, .pill:hover { background: rgba(239,233,223,.06); }
.zones { height: 40px; display: flex; justify-content: center; gap: 28px; }
.zone { height: 40px; border: 0; background: none; font-size: 15px; font-weight: 600; color: var(--ink-3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.zone::after { content: ''; width: 18px; height: 2px; border-radius: 1px; background: transparent; }
.zone.on { color: var(--ink); }
.zone.on::after { background: var(--warm); }

/* black glass cabinet, charcoal inside, one warm light */
.frame { position: absolute; left: 10px; right: 10px; border-radius: 24px; perspective: 1500px; box-shadow: 0 0 0 3px #000, 0 0 0 4px rgba(255,255,255,.07); }
.fridge { position: relative; overflow: hidden; border-radius: 22px; transition: filter .9s ease .2s; }
.closed .fridge { filter: brightness(0); }
.mid .fridge { filter: brightness(.6); }
.walls { position: absolute; inset: 0; transition: filter .5s ease; }
.w-back { fill: #181a1d; } .w-ceil { fill: #22252a; } .w-left, .w-right { fill: #121416; } .w-floor { fill: #0e1012; }
.w-seam { stroke: rgba(255,255,255,.05); stroke-width: 1; fill: none; }
.glass { fill: rgba(255, 238, 214, .05); } .glass-edge { stroke: rgba(255, 228, 190, .42); stroke-width: 1; }
.trim { fill: rgba(255, 238, 214, .12); } .trim-hi { stroke: rgba(255, 232, 200, .6); stroke-width: 1; } .under { fill: rgba(0,0,0,.3); }
.light { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(90% 60% at 50% 0%, rgba(255, 222, 170, .3), rgba(255, 222, 170, 0) 78%); transition: opacity .6s ease; }
.panel { position: absolute; left: 34px; right: 34px; top: 0; height: 10px; border-radius: 0 0 6px 6px; background: linear-gradient(180deg, #fff4e0, #f1d39e); }

.row { position: absolute; display: flex; justify-content: space-between; }
.col { position: relative; display: flex; flex-direction: column; align-items: center; }
.obj { display: flex; align-items: flex-end; justify-content: center; transition: opacity .5s ease, filter .5s ease; }
.obj svg { display: block; overflow: visible; }
.lab { position: absolute; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 1px; text-align: center; white-space: nowrap; }
.nm { font-size: 14px; font-weight: 600; }
.meta { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--ink-2); }
.soon { font-weight: 700; color: var(--warm); }
.tag { height: 20px; padding: 0 7px; border-radius: 6px; background: var(--red); color: #fff; font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; }
.drawer { position: absolute; border-radius: 12px 12px 22px 22px; background: linear-gradient(180deg, rgba(255,255,255,.025), rgba(255,255,255,.07)); box-shadow: inset 0 0 0 1px rgba(255, 228, 190, .2); }
.drawer::before { content: ''; position: absolute; left: 50%; top: 6px; width: 84px; height: 4px; border-radius: 2px; transform: translateX(-50%); background: rgba(255, 228, 190, .35); }

.open .obj svg { animation: rise 1s cubic-bezier(.16, 1, .3, 1) both .6s; }
@keyframes rise { from { opacity: 0; transform: translateY(-4px); } }
.lvl, .gone-able { transition: transform .9s cubic-bezier(.2, .8, .2, 1), opacity .5s ease; transform-box: fill-box; }
.lvl { transform-origin: 50% 100%; } .lvlx { transform-origin: 0% 50%; }
.gone { opacity: 0; transform: translateY(-14px); }

.door { position: absolute; inset: 0; z-index: 8; border-radius: 22px; transform-origin: left center; transition: transform 1.4s cubic-bezier(.16, 1, .3, 1), opacity .5s ease .9s;
  background: linear-gradient(112deg, rgba(255,255,255,.07) 0 16%, rgba(255,255,255,0) 16% 100%), linear-gradient(180deg, #1c1f22, #0a0b0c); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.door i { position: absolute; right: 18px; top: 150px; width: 6px; height: 300px; border-radius: 3px; background: linear-gradient(90deg, #2b2f33, #7a8288 50%, #2b2f33); }
.open .door { transform: rotateY(-100deg); opacity: 0; pointer-events: none; }
.mid .door { transform: rotateY(-44deg); }
.instant .door, .instant .fridge, .instant .obj svg { transition: none !important; animation: none !important; }

.dim .walls { filter: brightness(.55); }
.dim .light { opacity: .3; }
.dim .col:not(.lit) .obj { opacity: .22; filter: grayscale(.5); }
.spots { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
.beam { position: absolute; background: linear-gradient(180deg, rgba(255, 224, 176, 0), rgba(255, 224, 176, .3)); clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%); mix-blend-mode: screen; }
.chip { position: absolute; transform: translateX(-50%); height: 26px; padding: 0 10px; border-radius: 13px; background: #f6efe4; color: #15171a; font-size: 13px; font-weight: 700; display: flex; align-items: center; white-space: nowrap; box-shadow: 0 6px 14px -4px rgba(0,0,0,.6); transition: opacity .4s ease; }
.chip.fade { opacity: 0; }
.sheet { position: absolute; left: 10px; right: 10px; bottom: 92px; z-index: 7; padding: 20px 20px 16px; border-radius: 24px; background: var(--card); box-shadow: inset 0 0 0 1px rgba(255,255,255,.07), 0 18px 36px -18px rgba(0,0,0,.8); }
.sheet .body { transition: opacity .28s ease, transform .28s ease; }
.sheet .body.out { opacity: 0; transform: translateX(-18px); }
.sheet h2 { font-size: 24px; line-height: 1.15; font-weight: 700; letter-spacing: -.015em; text-wrap: balance; }
.why { margin-top: 8px; display: flex; gap: 8px; align-items: baseline; font-size: 15px; font-weight: 600; }
.why i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--red); transform: translateY(-1px); }
.facts, .plus { margin-top: 3px; font-size: 15px; color: var(--ink-2); }
.actions { margin-top: 16px; display: flex; gap: 10px; }
.go { flex: 1; height: 54px; border: 0; border-radius: 16px; background: #f3ede3; color: #121315; font-size: 16px; font-weight: 700; }
.go:hover:not(:disabled) { background: #fff; }
.go:disabled { opacity: .45; }
.alt { width: 116px; height: 54px; border-radius: 16px; border: 1px solid rgba(239,233,223,.18); background: none; font-size: 16px; font-weight: 600; }
.toast { position: absolute; left: 50%; top: 124px; z-index: 9; height: 46px; padding: 0 6px 0 16px; border-radius: 14px; background: #f3ede3; color: #121315; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; white-space: nowrap; box-shadow: 0 12px 26px -10px rgba(0,0,0,.7); opacity: 0; transform: translate(-50%, -10px); transition: opacity .35s ease, transform .45s cubic-bezier(.2, .9, .2, 1); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast button { height: 40px; padding: 0 12px; border: 0; background: none; font-weight: 700; text-decoration: underline; text-underline-offset: 4px; }

.tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding: 8px 12px 0; display: flex; justify-content: space-around; border-top: 1px solid rgba(255,255,255,.06); }
.tab { min-width: 72px; height: 48px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12.5px; font-weight: 600; color: var(--ink-3); }
.tab.on { color: var(--ink); }
.home { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; background: var(--ink); transform: translateX(-50%); }

.spots { transition: opacity .5s ease .9s; }
.closed .spots, .mid .spots { opacity: 0; transition: none; }
@media (prefers-reduced-motion: reduce) { .door, .fridge, .obj svg, .lvl, .gone-able, .toast, .sheet .body { transition: none !important; animation: none !important; } }
@media (max-width: 900px) { .stage { padding: 24px 16px; } .intro { flex-direction: column; align-items: flex-start; } }
</style>
</head>
<body>
<!--
THESIS: Fridge Light after dark. A black-glass fridge with a charcoal interior and one warm light from above; the food is the only colour in the room.
OWN-WORLD: Black glass and a thin dark handle, a charcoal interior in one-point perspective, a warm diffuser strip, glass shelves whose front edges catch the light. Food as soft, lit objects. Red Hat Display and Text. Warm amber for food due soon, red only for tomorrow.
STORY: The door swings open slowly and the light fades up; tonight's recipe lowers the light and warm beams find what it takes.
FIRST VIEWPORT: Pantry behind a closed black-glass door; logo centred in the header, zones as quiet text below.
FORM: Fridge Light variation 3 of 3 (seed 8bf790e3, direction chosen by the user).
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
<main class="stage">
  <div class="intro">
    <div>
      <h1>Fridge Light: Night</h1>
      <p>A black-glass fridge for 6pm. The interior is charcoal with one warm light from above, so the food is the only colour on screen. The door opens slowly and the light fades up. Food is drawn as soft, lit objects.</p>
    </div>
    <button class="replay" type="button" id="replay">Open the door again</button>
  </div>
  <div class="phones">
    <figure><div class="phone dim" id="tonight"></div><figcaption>What to cook</figcaption></figure>
    <figure><div class="phone" id="pantry"></div><figcaption>Pantry</figcaption></figure>
  </div>
</main>

<script>
/*@include fl/data.js fl/draw.js fl/engine.js*/
const LOGO = '__LOGO__';
const D = makeDraw('soft');
const LIGHT = '<div class="panel"></div>';

function pantry(el) {
  el.innerHTML = `${FL.status('#efe9df')}
    <div class="bar"><button type="button" class="ghost" aria-label="Search the pantry">${FL.icon('Search', 20)}</button><img class="logo" alt="Pantry2Plate" src="${LOGO}"><button type="button" class="ghost" aria-label="Put food away">${FL.icon('Plus', 20)}</button></div>
    <div class="zones" role="tablist"><button type="button" class="zone on" role="tab">Fridge</button><button type="button" class="zone" role="tab">Cupboard</button><button type="button" class="zone" role="tab">Freezer</button></div>
    <div class="frame" style="top:158px;height:606px">
      ${FL.fridge({ W: 373, H: 606, vpY: 14, k: .9, s: .84, D, labels: true, shelf: 'glass', top: LIGHT,
        rows: [
          { yf: 166, keys: ['milk', 'yogurt', 'butter'], widths: [150, 106, 85] },
          { yf: 302, keys: ['egg', 'cheddar', 'parm'], widths: [150, 96, 95] },
          { yf: 438, keys: ['chicken', 'bacon', 'chilli'], widths: [128, 110, 103] },
        ],
        drawer: { y0: 490, y1: 602, keys: ['spinach', 'mush'], itemTop: 2, oh: 62, labelTop: 68, scale: .82 } })}
      <div class="door"><i></i></div>
    </div>
    ${FL.tabs('Pantry')}`;
}

function tonight(el) {
  el.innerHTML = `${FL.status('#efe9df')}
    <div class="bar"><span></span><img class="logo" alt="Pantry2Plate" src="${LOGO}"><button type="button" class="pill">All recipes</button></div>
    <div class="frame" style="top:114px;height:392px">
      ${FL.fridge({ W: 373, H: 392, vpY: 12, k: .9, s: .62, D, labels: false, shelf: 'glass', top: LIGHT,
        rows: [
          { yf: 118, keys: ['milk', 'yogurt', 'butter'], widths: [150, 106, 85] },
          { yf: 218, keys: ['egg', 'cheddar', 'parm'], widths: [150, 96, 95] },
          { yf: 318, keys: ['chicken', 'bacon', 'chilli'], widths: [128, 110, 103] },
        ],
        drawer: { y0: 330, y1: 390, keys: ['spinach', 'mush'], itemTop: 0, oh: 52, labelTop: 0, scale: .9 } })}
      <div class="door"><i></i></div>
    </div>
    <div class="spots"></div>
    <div class="toast" role="status"><span></span><button type="button">Undo</button></div>
    <section class="sheet"><div class="body"></div><div class="actions"><button type="button" class="go">Cook this</button><button type="button" class="alt">Another</button></div></section>
    ${FL.tabs('Cook')}`;
  FL.wireTonight(el);
}

const T = document.getElementById('tonight'), P = document.getElementById('pantry');
pantry(P);
tonight(T);
FL.boot(T, P);
document.getElementById('replay').addEventListener('click', () => FL.open([T, P]));
</script>
</body>
</html>
